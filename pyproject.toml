[project]
name = "xianglianghua"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "姜念曦", email = "chen1136284722@foxmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "lancedb>=0.38.0",
    "modelscope>=1.40.0",
    "openai>=3.13.0",
    "pandas>=3.0.5",
    "pypdf>=6.18.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.0.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
xianglianghua = "xianglianghua:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
